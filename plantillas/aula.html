<!-- ======================================================================
     Academia IRT · Bloque del aula (ingreso con RUT o correo y sala del curso)
     Lo inserta herramientas/construir-cursos.js en la página de cada curso que
     tiene «aula» en assets/cursos.json. Las marcas {{…}} se reemplazan con esos
     datos. No cambie los id: los usan assets/aula-acceso.js y assets/aula.js.
     ====================================================================== -->
<!--INGRESO-->
<section class="seccion" id="ingresar" aria-labelledby="titulo-ingresar">
  <div class="wrap">
    <!-- Acceso. La URL del Apps Script de este curso se define en assets/aula-cursos.js,
         con la misma clave que data-curso (README, sección 5). -->
    <form class="acceso" id="acceso-form" data-curso="{{SLUG}}" novalidate>
      <div class="acceso__ico"><svg class="ico ico--g" aria-hidden="true"><use href="/assets/iconos.svg?v=20261025#i-candado"/></svg></div>
      <h2 id="titulo-ingresar">Ingresar a los módulos</h2>
      <p class="acceso__bajada">Solo para participantes inscritos.</p>
      <div class="campo">
        <label for="acceso-id">RUT o correo electrónico</label>
        <input id="acceso-id" name="identificador" type="text" inputmode="text" autocomplete="email" autocapitalize="none" spellcheck="false" aria-describedby="acceso-ayuda" required>
        <p class="campo__ayuda" id="acceso-ayuda">Use el mismo RUT o correo que registró en la ficha de inscripción. RUT sin puntos y con guion: 12345678-9</p>
      </div>
      <!-- Solo se muestra si el aula exige RUT y correo (MODO_ACCESO 'RUT_Y_CORREO') -->
      <div class="campo campo--correo" id="acceso-correo-campo" hidden>
        <label for="acceso-correo">Correo electrónico</label>
        <input id="acceso-correo" name="correo" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false">
      </div>
      <div class="aviso" id="acceso-mensaje" role="status" aria-live="polite"></div>
      <button type="submit" class="btn btn--primario" id="acceso-boton">Ingresar</button>
    </form>
  </div>
</section>
<!--/INGRESO-->
<!--AULA-->
<!-- ======================================================================
     SALA DEL CURSO (la dibuja assets/aula.js después de ingresar)
     Lee curso.json de esta misma carpeta: avisos, relator, fechas, módulos y
     ENDPOINT_FORO (README, sección 5d). Los PDF y tests los entrega el Apps Script.
     ====================================================================== -->
<div class="aula-cargando" id="aula-cargando" role="status" aria-live="polite" hidden><span class="cargador" aria-hidden="true"></span>Cargando su sala…</div>
<div class="aula-aviso" id="aula-aviso" role="status" aria-live="polite"></div>
<div class="sala" id="sala" data-config="curso.json" hidden></div>
<!--/AULA-->
